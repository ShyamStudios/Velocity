# Velocity connection-abuse protections.
# This file is created automatically next to velocity.toml on first boot.
# Every limit below accepts 0 to disable that individual check.
# All defaults are lenient toward legitimate players; see SECURITY.md for the
# threat model and tuning guidance.

# Master switch for the protections in this file.
enabled: true

# Maximum simultaneous connections from one source (IPv4 address, or IPv6 /64).
# Households and small LANs never come close; handshake floods open hundreds.
max-concurrent-connections-per-ip: 32

# Sustained new connections per second, per source, plus the burst allowance.
# Launchers open a couple per second; scanners and bots do dozens.
max-new-connections-per-second-per-ip: 10
new-connections-burst-per-ip: 20

# Backstop on simultaneous connections proxy-wide. Most single proxies peak well
# under ten thousand; lower this on small machines.
max-concurrent-connections-global: 50000

# Sustained new connections per second proxy-wide. 0 disables: flash crowds of
# legitimate players must never be dropped, per-source and concurrent limits
# already cover floods.
max-new-connections-per-second-global: 0

# Login attempts per second, per source. Logins cost RSA work plus a Mojang
# round trip, so this is deliberately tight; normal retries are human-paced.
# This complements advanced.login-ratelimit in velocity.toml.
max-login-attempts-per-second-per-ip: 2
login-attempts-burst-per-ip: 4

# Server-list (status) requests per second, per source. List refreshes are
# manual; botnets poll constantly, and each request can cost ping handling.
max-status-requests-per-second-per-ip: 5
status-requests-burst-per-ip: 10

# Repeat violators earn a short temporary penalty (never a permanent ban, so a
# shared address cannot be blocked forever by someone else's behavior).
abuse-penalty-threshold: 10
abuse-window-seconds: 60
abuse-penalty-seconds: 30

# Discord webhook for attack alerts. Empty disables webhooks (file fallback still
# works). Paste your https://discord.com/api/webhooks/... URL here. The URL is
# never logged. When an attack starts you get an instant "attack detected" ping;
# when it ends you get a summary (duration, blocked count per attack type, peak
# block rate, CPU spike). If Discord cannot be reached, the same report is saved
# as a file under attack-report-dir instead.
discord-webhook-url: ""
attack-notify-start: true
attack-notify-end: true

# An attack is declared when attack-detect-threshold blocked events (connections,
# logins, pings, malformed packets...) pile up within attack-detect-window-seconds.
# Lower this on small servers, raise it if flash crowds trigger false positives.
attack-detect-threshold: 100
attack-detect-window-seconds: 30

# The attack is considered over after attack-end-quiet-seconds with almost no new
# blocks. Then the summary report is sent.
attack-end-quiet-seconds: 60

# Directory (relative to the working dir) where attack reports are saved when
# Discord delivery fails — and always for the end-of-attack summary if you want
# a local audit trail. Files are named attack-yyyyMMdd-HHmmss-<type>.json.
attack-report-dir: "attack-reports"
