# Builds the Velocity proxy jar and attaches it to a GitHub Release.
# Trigger: push a tag like v4.1.2, or run manually from the Actions tab.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Build proxy jar
        run: ./gradlew :velocity-proxy:shadowJar
      - name: Attach jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: proxy/build/libs/*-all.jar
          generate_release_notes: true
